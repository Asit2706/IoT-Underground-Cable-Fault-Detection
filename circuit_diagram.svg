<svg width="1100" height="620" xmlns="http://www.w3.org/2000/svg" style="background:#f8f9fa;font-family:Arial,sans-serif">

  <!-- Background -->
  <rect width="1100" height="620" fill="#f0f0f0"/>
  <rect x="10" y="10" width="1080" height="600" fill="#ffffff" rx="12" stroke="#cccccc" stroke-width="2"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">IoT-Based Underground Cable Fault Detection System — Circuit Diagram</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- WIRES — POWER RAIL (Red top) -->
  <!-- 3.3V from ESP32 left side going to R1 start -->
  <line x1="720" y1="160" x2="80" y2="160" stroke="#e63946" stroke-width="3"/>
  <!-- GND rail (Blue bottom) -->
  <line x1="80" y1="340" x2="720" y2="340" stroke="#457b9d" stroke-width="3"/>

  <!-- Tap wires from nodes to ESP32 -->
  <!-- Node A tap (GPIO34) -->
  <line x1="230" y1="160" x2="230" y2="250" stroke="#228b22" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="230" y1="250" x2="720" y2="250" stroke="#228b22" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Node B tap (GPIO35) -->
  <line x1="380" y1="160" x2="380" y2="265" stroke="#ff8c00" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="380" y1="265" x2="720" y2="265" stroke="#ff8c00" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Node C tap (GPIO32) -->
  <line x1="530" y1="160" x2="530" y2="280" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="530" y1="280" x2="720" y2="280" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Node D tap (GPIO33) -->
  <line x1="620" y1="160" x2="620" y2="295" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="620" y1="295" x2="720" y2="295" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- GND wire from ESP32 -->
  <line x1="720" y1="340" x2="720" y2="340" stroke="#457b9d" stroke-width="3"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- RESISTOR R1 (80 to 230) -->
  <rect x="100" y="148" width="100" height="24" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
  <!-- Resistor stripes R1 -->
  <rect x="115" y="148" width="8" height="24" fill="#8B4513"/>
  <rect x="127" y="148" width="8" height="24" fill="#000"/>
  <rect x="139" y="148" width="8" height="24" fill="#ff4500"/>
  <rect x="151" y="148" width="8" height="24" fill="#ffd700"/>
  <rect x="163" y="148" width="8" height="24" fill="#ffd700"/>
  <text x="150" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">R1 (1kΩ)</text>
  <text x="150" y="192" text-anchor="middle" font-size="10" fill="#666">1 KM Segment</text>

  <!-- RESISTOR R2 (230 to 380) -->
  <rect x="258" y="148" width="100" height="24" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="273" y="148" width="8" height="24" fill="#8B4513"/>
  <rect x="285" y="148" width="8" height="24" fill="#000"/>
  <rect x="297" y="148" width="8" height="24" fill="#ff4500"/>
  <rect x="309" y="148" width="8" height="24" fill="#ffd700"/>
  <rect x="321" y="148" width="8" height="24" fill="#ffd700"/>
  <text x="308" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">R2 (1kΩ)</text>
  <text x="308" y="192" text-anchor="middle" font-size="10" fill="#666">2 KM Segment</text>

  <!-- RESISTOR R3 (380 to 530) -->
  <rect x="408" y="148" width="100" height="24" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="423" y="148" width="8" height="24" fill="#8B4513"/>
  <rect x="435" y="148" width="8" height="24" fill="#000"/>
  <rect x="447" y="148" width="8" height="24" fill="#ff4500"/>
  <rect x="459" y="148" width="8" height="24" fill="#ffd700"/>
  <rect x="471" y="148" width="8" height="24" fill="#ffd700"/>
  <text x="458" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">R3 (1kΩ)</text>
  <text x="458" y="192" text-anchor="middle" font-size="10" fill="#666">3 KM Segment</text>

  <!-- RESISTOR R4 (530 to 680) -->
  <rect x="548" y="148" width="100" height="24" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
  <rect x="563" y="148" width="8" height="24" fill="#8B4513"/>
  <rect x="575" y="148" width="8" height="24" fill="#000"/>
  <rect x="587" y="148" width="8" height="24" fill="#ff4500"/>
  <rect x="599" y="148" width="8" height="24" fill="#ffd700"/>
  <rect x="611" y="148" width="8" height="24" fill="#ffd700"/>
  <text x="598" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">R4 (1kΩ)</text>
  <text x="598" y="192" text-anchor="middle" font-size="10" fill="#666">4 KM Segment</text>

  <!-- GND end connection after R4 -->
  <line x1="648" y1="160" x2="680" y2="160" stroke="#e63946" stroke-width="3"/>
  <line x1="680" y1="160" x2="680" y2="340" stroke="#457b9d" stroke-width="3"/>

  <!-- Node dot markers on wire -->
  <circle cx="230" cy="160" r="5" fill="#228b22"/>
  <circle cx="380" cy="160" r="5" fill="#ff8c00"/>
  <circle cx="530" cy="160" r="5" fill="#9b59b6"/>
  <circle cx="620" cy="160" r="5" fill="#e74c3c"/>

  <!-- 3.3V label start -->
  <circle cx="80" cy="160" r="14" fill="#e63946"/>
  <text x="80" y="165" text-anchor="middle" font-size="10" fill="white" font-weight="bold">3.3V</text>

  <!-- GND label end -->
  <circle cx="680" cy="340" r="14" fill="#457b9d"/>
  <text x="680" y="345" text-anchor="middle" font-size="10" fill="white" font-weight="bold">GND</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- ESP32 BOARD -->
  <rect x="720" y="120" width="160" height="280" fill="#1a1a2e" rx="8" stroke="#444" stroke-width="2"/>
  <rect x="730" y="130" width="140" height="100" fill="#0d2137" rx="4"/>
  <text x="800" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#00d4ff">ESP32</text>
  <text x="800" y="195" text-anchor="middle" font-size="9" fill="#8899bb">Dev Module</text>

  <!-- WiFi symbol -->
  <path d="M790,205 Q800,195 810,205" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M785,210 Q800,197 815,210" stroke="#34d399" stroke-width="1.5" fill="none"/>
  <circle cx="800" cy="215" r="2" fill="#34d399"/>

  <!-- Left pins -->
  <rect x="718" y="150" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="162" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="174" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="186" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="198" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="210" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="222" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="234" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="246" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="258" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="270" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="282" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="294" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="306" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="318" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="330" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="342" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="354" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="366" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="718" y="378" width="12" height="6" fill="#c0c0c0" rx="1"/>

  <!-- Right pins -->
  <rect x="870" y="150" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="162" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="174" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="186" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="198" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="210" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="222" width="12" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="870" y="234" width="12" height="6" fill="#c0c0c0" rx="1"/>

  <!-- Pin Labels on ESP32 -->
  <text x="715" y="155" text-anchor="end" font-size="9" fill="#e63946" font-weight="bold">3.3V</text>
  <text x="715" y="167" text-anchor="end" font-size="9" fill="#457b9d" font-weight="bold">GND</text>
  <text x="715" y="179" text-anchor="end" font-size="9" fill="#228b22">GPIO34</text>
  <text x="715" y="191" text-anchor="end" font-size="9" fill="#ff8c00">GPIO35</text>
  <text x="715" y="203" text-anchor="end" font-size="9" fill="#9b59b6">GPIO32</text>
  <text x="715" y="215" text-anchor="end" font-size="9" fill="#e74c3c">GPIO33</text>
  <text x="715" y="227" text-anchor="end" font-size="9" fill="#00aaff">GPIO21(SDA)</text>
  <text x="715" y="239" text-anchor="end" font-size="9" fill="#00aaff">GPIO22(SCL)</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- OLED DISPLAY -->
  <rect x="920" y="200" width="130" height="80" fill="#0a0a2e" rx="6" stroke="#3b82f6" stroke-width="2"/>
  <rect x="930" y="210" width="110" height="55" fill="#000080" rx="3"/>
  <!-- OLED screen content simulation -->
  <text x="985" y="228" text-anchor="middle" font-size="7" fill="#ffffff" font-weight="bold">!! FAULT !!</text>
  <text x="985" y="240" text-anchor="middle" font-size="7" fill="#aaaaff">Location:</text>
  <text x="985" y="255" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">2 KM</text>
  <!-- OLED pins -->
  <rect x="940" y="196" width="10" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="954" y="196" width="10" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="968" y="196" width="10" height="6" fill="#c0c0c0" rx="1"/>
  <rect x="982" y="196" width="10" height="6" fill="#c0c0c0" rx="1"/>
  <text x="945" y="192" text-anchor="middle" font-size="7" fill="#555">GND</text>
  <text x="959" y="192" text-anchor="middle" font-size="7" fill="#555">VCC</text>
  <text x="973" y="192" text-anchor="middle" font-size="7" fill="#555">SCL</text>
  <text x="987" y="192" text-anchor="middle" font-size="7" fill="#555">SDA</text>
  <text x="985" y="295" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="bold">OLED SSD1306</text>
  <text x="985" y="308" text-anchor="middle" font-size="9" fill="#666">128×64 I2C</text>

  <!-- OLED wires -->
  <!-- VCC wire -->
  <line x1="882" y1="153" x2="920" y2="153" stroke="#e63946" stroke-width="2"/>
  <line x1="920" y1="153" x2="959" y2="153" stroke="#e63946" stroke-width="2"/>
  <line x1="959" y1="153" x2="959" y2="196" stroke="#e63946" stroke-width="2"/>
  <!-- GND wire -->
  <line x1="882" y1="165" x2="910" y2="165" stroke="#457b9d" stroke-width="2"/>
  <line x1="910" y1="165" x2="910" y2="400" stroke="#457b9d" stroke-width="2"/>
  <line x1="910" y1="400" x2="945" y2="400" stroke="#457b9d" stroke-width="2"/>
  <line x1="945" y1="400" x2="945" y2="202" stroke="#457b9d" stroke-width="2"/>
  <!-- SCL wire -->
  <line x1="882" y1="225" x2="900" y2="225" stroke="#00aaff" stroke-width="2"/>
  <line x1="900" y1="225" x2="900" y2="185" stroke="#00aaff" stroke-width="2"/>
  <line x1="900" y1="185" x2="973" y2="185" stroke="#00aaff" stroke-width="2"/>
  <line x1="973" y1="185" x2="973" y2="196" stroke="#00aaff" stroke-width="2"/>
  <!-- SDA wire -->
  <line x1="882" y1="237" x2="895" y2="237" stroke="#00ccff" stroke-width="2"/>
  <line x1="895" y1="237" x2="895" y2="180" stroke="#00ccff" stroke-width="2"/>
  <line x1="895" y1="180" x2="987" y2="180" stroke="#00ccff" stroke-width="2"/>
  <line x1="987" y1="180" x2="987" y2="196" stroke="#00ccff" stroke-width="2"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- CLOUD / WIFI SYMBOL -->
  <rect x="920" y="370" width="140" height="80" fill="#e8f4fd" rx="10" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="990" y="400" text-anchor="middle" font-size="22">☁️</text>
  <text x="990" y="420" text-anchor="middle" font-size="11" fill="#1a6fb5" font-weight="bold">Firebase Cloud</text>
  <text x="990" y="435" text-anchor="middle" font-size="9" fill="#666">via WiFi (ESP32)</text>
  <!-- WiFi arrow -->
  <line x1="880" y1="300" x2="920" y2="410" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="895" y="360" font-size="9" fill="#34d399">WiFi 📡</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- LEGEND BOX -->
  <rect x="30" y="400" width="280" height="180" fill="#f8f9fa" rx="8" stroke="#cccccc" stroke-width="1.5"/>
  <text x="170" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e">Legend</text>

  <line x1="50" y1="440" x2="90" y2="440" stroke="#e63946" stroke-width="3"/>
  <text x="100" y="444" font-size="11" fill="#333">3.3V Power Rail</text>

  <line x1="50" y1="458" x2="90" y2="458" stroke="#457b9d" stroke-width="3"/>
  <text x="100" y="462" font-size="11" fill="#333">GND Rail</text>

  <line x1="50" y1="476" x2="90" y2="476" stroke="#228b22" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="480" font-size="11" fill="#333">Node A Tap → GPIO 34</text>

  <line x1="50" y1="494" x2="90" y2="494" stroke="#ff8c00" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="498" font-size="11" fill="#333">Node B Tap → GPIO 35</text>

  <line x1="50" y1="512" x2="90" y2="512" stroke="#9b59b6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="516" font-size="11" fill="#333">Node C Tap → GPIO 32</text>

  <line x1="50" y1="530" x2="90" y2="530" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="100" y="534" font-size="11" fill="#333">Node D Tap → GPIO 33</text>

  <line x1="50" y1="548" x2="90" y2="548" stroke="#00aaff" stroke-width="2"/>
  <text x="100" y="552" font-size="11" fill="#333">I2C (SDA/SCL) → OLED</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- FAULT SIMULATION NOTE -->
  <rect x="330" y="410" width="360" height="70" fill="#fff3cd" rx="8" stroke="#ffc107" stroke-width="1.5"/>
  <text x="510" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">⚠ Fault Simulation</text>
  <text x="510" y="450" text-anchor="middle" font-size="10" fill="#856404">Remove R1 → Fault at 1 KM (Node A drops)</text>
  <text x="510" y="466" text-anchor="middle" font-size="10" fill="#856404">Remove R2 → Fault at 2 KM (Node B drops)</text>
  <text x="510" y="482" text-anchor="middle" font-size="10" fill="#856404">Remove R3 → Fault at 3 KM (Node C drops)</text>

  <!-- Power supply note -->
  <rect x="330" y="490" width="360" height="50" fill="#d4edda" rx="8" stroke="#28a745" stroke-width="1.5"/>
  <text x="510" y="510" text-anchor="middle" font-size="11" font-weight="bold" fill="#155724">✔ Voltage Divider Principle</text>
  <text x="510" y="528" text-anchor="middle" font-size="10" fill="#155724">A≈2926 | B≈1889 | C≈860 | D≈0 (ADC 0-4095)</text>

</svg>
