<svg width="900" height="1020" xmlns="http://www.w3.org/2000/svg" style="font-family:Arial,sans-serif">

  <!-- Background -->
  <rect width="900" height="1020" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="1000" fill="#f8faff" rx="14" stroke="#d0d8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">IoT Cable Fault Detection System — Flowchart</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- BLOCK 1: START -->
  <ellipse cx="450" cy="95" rx="90" ry="30" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">START</text>

  <line x1="450" y1="125" x2="450" y2="148" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK 2: Power ON -->
  <rect x="300" y="150" width="300" height="50" fill="#dbeafe" rx="10" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="181" text-anchor="middle" font-size="13" fill="#1e3a5f" font-weight="bold">System Power ON</text>

  <line x1="450" y1="200" x2="450" y2="223" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK 3: Initialize -->
  <rect x="270" y="225" width="360" height="55" fill="#eff6ff" rx="10" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Initialize ESP32, OLED, ADC Pins</text>
  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#6b7280">(GPIO 34, 35, 32, 33 | SDA:21, SCL:22)</text>

  <line x1="450" y1="280" x2="450" y2="303" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK 4: Connect WiFi -->
  <rect x="300" y="305" width="300" height="55" fill="#eff6ff" rx="10" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="330" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Connect to WiFi Hotspot</text>
  <text x="450" y="348" text-anchor="middle" font-size="10" fill="#6b7280">(SSID + Password)</text>

  <line x1="450" y1="360" x2="450" y2="383" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DECISION 5: WiFi Connected? -->
  <polygon points="450,385 590,425 450,465 310,425" fill="#fef9c3" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="420" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">WiFi Connected?</text>

  <!-- NO → retry loop left -->
  <line x1="310" y1="425" x2="220" y2="425" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="220" y1="425" x2="220" y2="332" stroke="#dc2626" stroke-width="2"/>
  <line x1="220" y1="332" x2="300" y2="332" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="258" y="418" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">NO</text>
  <text x="200" y="382" text-anchor="middle" font-size="9" fill="#dc2626">Retry</text>

  <!-- YES → down -->
  <line x1="450" y1="465" x2="450" y2="488" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="468" y="482" font-size="11" fill="#059669" font-weight="bold">YES</text>

  <!-- BLOCK 6: Read ADC -->
  <rect x="270" y="490" width="360" height="55" fill="#f0fdf4" rx="10" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="515" text-anchor="middle" font-size="12" fill="#065f46" font-weight="bold">Read ADC Values</text>
  <text x="450" y="533" text-anchor="middle" font-size="10" fill="#6b7280">Node A(GPIO34), B(GPIO35), C(GPIO32), D(GPIO33)</text>

  <line x1="450" y1="545" x2="450" y2="568" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DECISION 7: Voltage Drop? -->
  <polygon points="450,570 600,615 450,660 300,615" fill="#fff1f2" stroke="#e94560" stroke-width="2"/>
  <text x="450" y="609" text-anchor="middle" font-size="12" fill="#9f1239" font-weight="bold">Voltage Drop</text>
  <text x="450" y="627" text-anchor="middle" font-size="12" fill="#9f1239" font-weight="bold">Detected?</text>

  <!-- NO → right loop back to read -->
  <line x1="600" y1="615" x2="680" y2="615" stroke="#059669" stroke-width="2"/>
  <line x1="680" y1="615" x2="680" y2="517" stroke="#059669" stroke-width="2"/>
  <line x1="680" y1="517" x2="630" y2="517" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="638" y="609" font-size="11" fill="#059669" font-weight="bold">NO</text>
  <text x="700" y="572" text-anchor="middle" font-size="9" fill="#059669">Monitor</text>
  <text x="700" y="584" text-anchor="middle" font-size="9" fill="#059669">continuously</text>

  <!-- YES → down -->
  <line x1="450" y1="660" x2="450" y2="683" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="468" y="677" font-size="11" fill="#dc2626" font-weight="bold">YES</text>

  <!-- BLOCK 8: Calculate fault location -->
  <rect x="270" y="685" width="360" height="55" fill="#fff1f2" rx="10" stroke="#e94560" stroke-width="2"/>
  <text x="450" y="710" text-anchor="middle" font-size="12" fill="#9f1239" font-weight="bold">Calculate Fault Location</text>
  <text x="450" y="728" text-anchor="middle" font-size="10" fill="#6b7280">Compare A, B, C vs baseline − drop_margin</text>

  <line x1="450" y1="740" x2="450" y2="763" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK 9: Show OLED -->
  <rect x="270" y="765" width="360" height="55" fill="#faf5ff" rx="10" stroke="#9b59b6" stroke-width="2"/>
  <text x="450" y="790" text-anchor="middle" font-size="12" fill="#5b21b6" font-weight="bold">Display on OLED</text>
  <text x="450" y="808" text-anchor="middle" font-size="10" fill="#6b7280">!! FAULT !! Location: X KM</text>

  <line x1="450" y1="820" x2="450" y2="843" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK 10: Send to Firebase -->
  <rect x="270" y="845" width="360" height="55" fill="#eff6ff" rx="10" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="870" text-anchor="middle" font-size="12" fill="#1e3a5f" font-weight="bold">Send Data to Firebase</text>
  <text x="450" y="888" text-anchor="middle" font-size="10" fill="#6b7280">HTTP PUT → /current + /history (once per fault)</text>

  <line x1="450" y1="900" x2="450" y2="923" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCK 11: Dashboard Alert -->
  <rect x="270" y="925" width="360" height="55" fill="#fffbeb" rx="10" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="950" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">Trigger Dashboard Alerts</text>
  <text x="450" y="968" text-anchor="middle" font-size="10" fill="#6b7280">Sound + Popup + Flashing Red Background</text>

  <line x1="450" y1="980" x2="450" y2="990" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- END -->
  <ellipse cx="450" cy="1000" rx="90" ry="22" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
  <text x="450" y="1006" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Wait / Repeat</text>

  <!-- Loop back arrow -->
  <line x1="360" y1="1000" x2="130" y2="1000" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="130" y1="1000" x2="130" y2="517" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="130" y1="517" x2="270" y2="517" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="118" y="760" text-anchor="middle" font-size="9" fill="#94a3b8" transform="rotate(-90,118,760)">Loop every 1 second</text>

</svg>
